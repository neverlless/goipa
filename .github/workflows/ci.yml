name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet integration tests
        run: go vet -tags integration ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage gate (80 %)
        run: |
          go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print "coverage " $3 "%"; if ($3 + 0 < 80) exit 1 }'

      - name: Upload coverage
        if: github.event_name == 'push' && matrix.go == 'go.mod'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      # gosec v2.29.0 cannot type-check against Go 1.27 export data and, with
      # -quiet, still exits 0. Scan with the go.mod minimum and without -quiet
      # so a type-check failure fails the step.
      - name: gosec
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

  apidiff:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Stricter than semver requires on v0: ubccr/goipa v0.0.7 users depend on drop-in compatibility.
      - name: apidiff against the latest tag
        shell: bash
        run: |
          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
          base=$(git describe --tags --abbrev=0)
          git worktree add "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && apidiff -m -w "$RUNNER_TEMP/base.api" github.com/neverlless/goipa)
          apidiff -m -incompatible "$RUNNER_TEMP/base.api" github.com/neverlless/goipa | tee "$RUNNER_TEMP/apidiff.txt"
          test ! -s "$RUNNER_TEMP/apidiff.txt"
