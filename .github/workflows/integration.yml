name: Integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeipa:
    name: FreeIPA ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Nightly runs keep every leg for its replay artifacts and the report;
      # a manual run on a branch stops at the first failing release.
      fail-fast: ${{ github.event_name != 'schedule' }}
      matrix:
        image: [almalinux-8-4.9.13, almalinux-9-4.12.2, almalinux-9-4.13.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Kerberos client
        run: sudo apt-get update && sudo apt-get install -y krb5-user

      - name: Start FreeIPA
        run: IMAGE=${{ matrix.image }} scripts/ipa-up.sh

      # ipa-up.sh writes the credentials to .env; CI=true makes the contract
      # tests fail instead of skipping when they are missing.
      - name: Test
        env:
          IPATEST_RECORD: ${{ runner.temp }}/replay
        run: set -a; . ./.env; set +a; go test -race -tags integration -count=1 ./...

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.image }}
          path: ${{ runner.temp }}/replay
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: |
          docker logs --tail 200 goipa-ipa || true
          docker exec goipa-ipa tail -200 /var/log/httpd/error_log || true

  catalogue:
    name: Catalogue up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Regenerate
        run: go generate ./... && git diff --exit-code -- catalogue_gen.go

  report:
    name: Report failure
    needs: [freeipa, catalogue]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update issue
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create nightly-failure --force --repo "$GITHUB_REPOSITORY"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly integration failed" --label nightly-failure --body "$url"
          fi
